name: Release As Tag
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_PAT }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: yarn --no-immutable
      - name: Build
        run: yarn build
      - name: Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f packages/core/lib/ || true
          git add -f packages/memory/lib/ || true
          git add -f packages/mongo/lib/ || true
          git add -f packages/sql-utils/lib/ || true
          git add -f packages/sqlite/lib/ || true
          git add -f packages/mysql/lib/ || true
          git add -f packages/postgres/lib/ || true
          git commit -m "chore(release): ${GITHUB_REF#refs/tags/}"
          git tag -f -a -m "Release ${GITHUB_REF#refs/tags/}" "${GITHUB_REF#refs/tags/}"
          git push https://x-access-token:${{ secrets.RELEASE_PAT }}@github.com/${{ github.repository }}.git ${GITHUB_REF} --force
